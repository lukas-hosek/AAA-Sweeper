<svg xmlns="http://www.w3.org/2000/svg">
	<!--
		Pixel-art icons for the Win98 desktop, taskbar and dialogs.
		Referenced as <use href="assets/icons.svg#icon-mine"/> from index.html and js/scenes/desktop/.
	-->


	<!-- The game's desktop icon: a classic sea mine -->
	<symbol id="icon-mine" viewBox="0 0 32 32" shape-rendering="crispEdges">
		<rect x="15" y="3" width="2" height="26" fill="#000"/>
		<rect x="3" y="15" width="26" height="2" fill="#000"/>
		<rect x="7" y="7" width="3" height="3" fill="#000"/>
		<rect x="22" y="7" width="3" height="3" fill="#000"/>
		<rect x="7" y="22" width="3" height="3" fill="#000"/>
		<rect x="22" y="22" width="3" height="3" fill="#000"/>
		<rect x="11" y="8" width="10" height="16" fill="#000"/>
		<rect x="8" y="11" width="16" height="10" fill="#000"/>
		<rect x="9" y="9" width="14" height="14" fill="#000"/>
		<rect x="12" y="11" width="3" height="3" fill="#fff"/>
	</symbol>


	<!-- The little arrow badge of a desktop shortcut -->
	<symbol id="icon-shortcut-arrow" viewBox="0 0 10 10" shape-rendering="crispEdges">
		<rect x="0" y="0" width="10" height="10" fill="#000"/>
		<rect x="1" y="1" width="8" height="8" fill="#fff"/>
		<rect x="4" y="2" width="4" height="1" fill="#000"/>
		<rect x="6" y="3" width="2" height="2" fill="#000"/>
		<rect x="5" y="4" width="1" height="1" fill="#000"/>
		<rect x="4" y="5" width="1" height="1" fill="#000"/>
		<rect x="3" y="6" width="1" height="2" fill="#000"/>
		<rect x="2" y="7" width="1" height="1" fill="#000"/>
	</symbol>


	<!-- My Computer -->
	<symbol id="icon-computer" viewBox="0 0 32 32" shape-rendering="crispEdges">
		<rect x="5" y="3" width="22" height="18" fill="#c3c0b4"/>
		<rect x="5" y="3" width="22" height="1" fill="#fff"/>
		<rect x="5" y="3" width="1" height="18" fill="#fff"/>
		<rect x="26" y="3" width="1" height="18" fill="#58564e"/>
		<rect x="5" y="20" width="22" height="1" fill="#58564e"/>
		<rect x="8" y="6" width="16" height="11" fill="#000"/>
		<rect x="9" y="7" width="14" height="9" fill="#008080"/>
		<rect x="10" y="8" width="5" height="2" fill="#54d0d0"/>
		<rect x="12" y="21" width="8" height="2" fill="#8d8a7f"/>
		<rect x="6" y="23" width="20" height="5" fill="#c3c0b4"/>
		<rect x="6" y="23" width="20" height="1" fill="#fff"/>
		<rect x="6" y="27" width="20" height="1" fill="#58564e"/>
		<rect x="20" y="25" width="4" height="1" fill="#2e7d32"/>
	</symbol>


	<!-- My Documents -->
	<symbol id="icon-folder" viewBox="0 0 32 32" shape-rendering="crispEdges">
		<rect x="3" y="8" width="11" height="3" fill="#c9a200"/>
		<rect x="3" y="10" width="26" height="17" fill="#e0b400"/>
		<rect x="8" y="6" width="15" height="9" fill="#fff"/>
		<rect x="10" y="8" width="10" height="1" fill="#7a7a7a"/>
		<rect x="10" y="10" width="8" height="1" fill="#7a7a7a"/>
		<rect x="3" y="13" width="26" height="14" fill="#ffd83b"/>
		<rect x="3" y="13" width="26" height="1" fill="#fff2a0"/>
		<rect x="28" y="13" width="1" height="14" fill="#a07800"/>
		<rect x="3" y="26" width="26" height="1" fill="#a07800"/>
	</symbol>


	<!-- Recycle Bin -->
	<symbol id="icon-recycle-bin" viewBox="0 0 32 32" shape-rendering="crispEdges">
		<rect x="7" y="6" width="18" height="3" fill="#9a9a9a"/>
		<rect x="7" y="6" width="18" height="1" fill="#e6e6e6"/>
		<rect x="8" y="9" width="16" height="19" fill="#c8c8c8"/>
		<rect x="10" y="10" width="1" height="17" fill="#7c7c7c"/>
		<rect x="13" y="10" width="1" height="17" fill="#7c7c7c"/>
		<rect x="16" y="10" width="1" height="17" fill="#7c7c7c"/>
		<rect x="19" y="10" width="1" height="17" fill="#7c7c7c"/>
		<rect x="22" y="10" width="1" height="17" fill="#7c7c7c"/>
		<rect x="8" y="27" width="16" height="1" fill="#5a5a5a"/>
		<rect x="12" y="13" width="8" height="8" fill="#fff"/>
		<rect x="13" y="15" width="6" height="1" fill="#2a7"/>
		<rect x="13" y="17" width="5" height="1" fill="#2a7"/>
	</symbol>


	<!-- Notepad document (the patch notes) -->
	<symbol id="icon-notepad" viewBox="0 0 32 32" shape-rendering="crispEdges">
		<rect x="7" y="3" width="18" height="26" fill="#fff"/>
		<rect x="7" y="3" width="18" height="3" fill="#1f4fbf"/>
		<rect x="24" y="3" width="1" height="26" fill="#7c7c7c"/>
		<rect x="7" y="28" width="18" height="1" fill="#7c7c7c"/>
		<rect x="9" y="9" width="13" height="1" fill="#555"/>
		<rect x="9" y="12" width="11" height="1" fill="#555"/>
		<rect x="9" y="15" width="13" height="1" fill="#555"/>
		<rect x="9" y="18" width="9" height="1" fill="#555"/>
		<rect x="9" y="21" width="12" height="1" fill="#555"/>
	</symbol>


	<!-- The Start button's window logo -->
	<symbol id="icon-start" viewBox="0 0 16 16" shape-rendering="crispEdges">
		<rect x="1" y="2" width="14" height="12" fill="#000"/>
		<rect x="2" y="3" width="12" height="2" fill="#000080"/>
		<rect x="2" y="5" width="12" height="8" fill="#fff"/>
		<rect x="3" y="7" width="5" height="1" fill="#808080"/>
		<rect x="3" y="9" width="7" height="1" fill="#808080"/>
	</symbol>


	<!-- Taskbar tray volume icon -->
	<symbol id="icon-speaker" viewBox="0 0 16 16" shape-rendering="crispEdges">
		<rect x="2" y="6" width="3" height="4" fill="#000"/>
		<rect x="5" y="5" width="1" height="6" fill="#000"/>
		<rect x="6" y="4" width="1" height="8" fill="#000"/>
		<rect x="7" y="3" width="1" height="10" fill="#000"/>
		<rect x="10" y="6" width="1" height="4" fill="#000"/>
		<rect x="12" y="4" width="1" height="8" fill="#000"/>
	</symbol>


	<!-- Message box: information -->
	<symbol id="icon-info" viewBox="0 0 32 32">
		<circle cx="16" cy="16" r="13" fill="#fff" stroke="#000"/>
		<circle cx="16" cy="16" r="11" fill="#1c3fd1"/>
		<rect x="14.5" y="13" width="3" height="11" fill="#fff"/>
		<rect x="14.5" y="8" width="3" height="3" fill="#fff"/>
	</symbol>


	<!-- Message box: warning -->
	<symbol id="icon-warning" viewBox="0 0 32 32">
		<path d="M16 3 L30 28 H2 Z" fill="#ffd400" stroke="#000"/>
		<rect x="14.5" y="11" width="3" height="10" fill="#000"/>
		<rect x="14.5" y="23" width="3" height="3" fill="#000"/>
	</symbol>
</svg>
